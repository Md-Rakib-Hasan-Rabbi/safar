<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/output.css" />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");
  </style>
  <link rel="stylesheet" href="./css/custom-animation.css" />
  <title>Admin Sign Up | Safar</title>
</head>

<body class="bg-amber-50 text-gray-800 min-h-screen flex flex-col">
  <div class="min-h-screen flex items-center justify-center py-8">
    <div class="bg-white p-10 rounded-2xl shadow-md w-full max-w-md text-center fade-in">
      <div class="flex items-center mb-6 justify-center float">
        <a href="../index.html"><img src="../img/Safar-logo-2.png" alt="Safar Logo" class="h-10" /></a>
        <h1 class="text-3xl font-bold text-green-800 mt-2">Safar</h1>
      </div>

      <div class="slide-up">
        <h2 class="text-2xl font-bold text-gray-900 mb-2">Admin Account Signup</h2>
        <p class="text-gray-600 text-sm mb-6">Create your admin account to manage the Safar platform.</p>

        <form id="signupForm" class="space-y-3">
          <div class="text-left">
            <label class="sr-only" for="fullname">Full Name</label>
            <div class="flex items-center border rounded-xl px-4 py-3 input-group">
              <img src="../img/sign-up-login/user.png" class="h-4" alt="" />
              <input type="text" id="fullname" name="fullname" placeholder="Full Name" autocomplete="name"
                class="w-full bg-transparent outline-none text-gray-900 px-3" required />
            </div>
          </div>

          <div class="text-left">
            <label class="block text-sm font-medium text-gray-700 mb-1">Gender</label>
            <div class="flex gap-4">
              <label class="flex items-center">
                <input type="radio" name="gender" value="Male" required class="mr-2" />
                <span>Male</span>
              </label>
              <label class="flex items-center">
                <input type="radio" name="gender" value="Female" class="mr-2" />
                <span>Female</span>
              </label>
              <label class="flex items-center">
                <input type="radio" name="gender" value="Other" class="mr-2" />
                <span>Other</span>
              </label>
            </div>
          </div>

          <div class="text-left">
            <label class="sr-only" for="email">Email</label>
            <div class="flex items-center border rounded-xl px-4 py-3 input-group">
              <img src="../img/sign-up-login/email.png" class="h-4" alt="" />
              <input type="email" id="email" name="email" placeholder="Email" autocomplete="email"
                class="w-full bg-transparent outline-none text-gray-900 px-3" required />
            </div>
          </div>

          <div class="text-left">
            <label class="sr-only" for="phone">Phone Number</label>
            <div class="flex items-center border rounded-xl px-4 py-3 input-group">
              <img src="../img/sign-up-login/phone.png" class="h-4" alt="" />
              <input type="tel" id="phone" name="phone" placeholder="Phone Number" autocomplete="tel"
                class="w-full bg-transparent outline-none text-gray-900 px-3" required />
            </div>
          </div>

          <div class="text-left">
            <label class="sr-only" for="password">Password</label>
            <div class="flex items-center border rounded-xl px-4 py-3 input-group">
              <img src="../img/sign-up-login/padlock.png" class="h-4" alt="" />
              <input type="password" id="password" name="password" placeholder="Password" autocomplete="new-password"
                class="w-full px-3 bg-transparent outline-none text-gray-900" required />
              <img src="../img/sign-up-login/eye.png" id="togglePassword"
                class="h-5 cursor-pointer hover:opacity-70 transition-opacity" alt="Toggle password visibility" />
            </div>
          </div>

          <div class="text-left">
            <label class="sr-only" for="confirmPassword">Confirm Password</label>
            <div class="flex items-center border rounded-xl px-4 py-3 input-group">
              <img src="../img/sign-up-login/padlock.png" class="h-4" alt="" />
              <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password"
                autocomplete="new-password" class="w-full px-3 bg-transparent outline-none text-gray-900" required />
              <img src="../img/sign-up-login/eye.png" id="toggleConfirmPassword"
                class="h-5 cursor-pointer hover:opacity-70 transition-opacity" alt="Toggle password visibility" />
            </div>
          </div>

          <div class="flex items-start text-left text-sm text-gray-600 mt-4">
            <input type="checkbox" id="terms" class="mt-1 mr-2" required />
            <label for="terms">
              I agree to the
              <a href="./termsNcondition.html" class="text-green-800 font-semibold link-hover">Terms & Conditions</a>
              and
              <a href="./privacy.html" class="text-green-800 font-semibold link-hover">Privacy Policy</a>
            </label>
          </div>

          <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-xl font-semibold btn-login mt-4">
            Create Admin Account
          </button>
        </form>

        <p class="text-sm text-gray-700 mt-6">
          Want a different role?
          <a href="/signup" class="text-green-800 font-semibold link-hover">Choose account type</a>
        </p>
        <p class="text-sm text-gray-700 mt-1">
          Already have an account?
          <a href="/login" class="text-green-800 font-semibold link-hover">Log in</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    const signupRole = 'Admin';

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        alert('Passwords do not match');
        return;
      }

      const selectedGender = document.querySelector('input[name="gender"]:checked');
      if (!selectedGender) {
        alert('Please select your gender');
        return;
      }

      const formData = {
        name: document.getElementById('fullname').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        gender: selectedGender.value,
        userType: signupRole,
        password,
        confirmPassword,
      };

      try {
        const response = await fetch('http://localhost:5000/api/signup', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(formData),
        });

        const data = await response.json();

        if (response.ok) {
          alert('Admin signup successful!');
          window.location.href = '/login';
        } else {
          alert(data.message || 'Signup failed');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('An error occurred during signup');
      }
    });

    const togglePassword = document.getElementById('togglePassword');
    const passwordField = document.getElementById('password');
    const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
    const confirmPasswordField = document.getElementById('confirmPassword');

    if (togglePassword && passwordField) {
      togglePassword.addEventListener('click', function () {
        const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordField.setAttribute('type', type);
        this.style.opacity = type === 'text' ? '0.5' : '1';
      });
    }

    if (toggleConfirmPassword && confirmPasswordField) {
      toggleConfirmPassword.addEventListener('click', function () {
        const type = confirmPasswordField.getAttribute('type') === 'password' ? 'text' : 'password';
        confirmPasswordField.setAttribute('type', type);
        this.style.opacity = type === 'text' ? '0.5' : '1';
      });
    }
  </script>
</body>

</html>
