<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings | Safar</title>
  <link rel="stylesheet" href="src/css/output.css" />
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">
  <header class="bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <img src="./img/Safar-logo.png" alt="Safar Logo" class="h-8" />
      </a>

      <nav class="hidden md:flex items-center gap-3 text-sm">
        <a id="dashboardLink" href="rider-dashboard.html" class="px-4 py-2 rounded-lg bg-gray-100 hover:bg-gray-200">Dashboard</a>
        <a href="index.html" class="px-4 py-2 rounded-lg bg-gray-100 hover:bg-gray-200">Home</a>
        <button id="quickLogout" class="px-4 py-2 rounded-lg bg-red-50 text-red-600 border border-red-200 hover:bg-red-100">Logout</button>
      </nav>

      <button id="mobileLogout" class="md:hidden px-3 py-2 rounded-lg bg-red-50 text-red-600 border border-red-200">Logout</button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-6">
    <section class="bg-white rounded-2xl shadow-sm p-8 mb-6 border border-gray-100">
      <h1 class="text-3xl font-bold">Settings</h1>
      <p class="text-gray-600 mt-2">Manage your profile, account security, and app preferences from one place.</p>
    </section>

    <div class="grid lg:grid-cols-3 gap-6">
      <aside class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100 lg:col-span-1">
        <h2 class="text-lg font-semibold mb-4">Profile</h2>
        <div class="space-y-3 text-sm">
          <div>
            <p class="text-gray-500">Name</p>
            <p id="profileName" class="font-medium">User</p>
          </div>
          <div>
            <p class="text-gray-500">Email</p>
            <p id="profileEmail" class="font-medium">user@safar.app</p>
          </div>
          <div>
            <p class="text-gray-500">Role</p>
            <p id="profileRole" class="font-medium">Rider</p>
          </div>
        </div>
      </aside>

      <section class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100 lg:col-span-2">
        <div class="grid sm:grid-cols-3 gap-3 mb-6">
          <button data-panel="account" class="settings-tab bg-green-600 text-white px-4 py-2 rounded-lg font-medium">Account</button>
          <button data-panel="security" class="settings-tab bg-gray-100 text-gray-700 px-4 py-2 rounded-lg font-medium">Security</button>
          <button data-panel="preferences" class="settings-tab bg-gray-100 text-gray-700 px-4 py-2 rounded-lg font-medium">Preferences</button>
        </div>

        <div id="panel-account" class="settings-panel space-y-4">
          <h3 class="text-xl font-semibold">Account Information</h3>
          <div class="grid md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm text-gray-600 mb-1">Full Name</label>
              <input id="nameInput" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-green-500" />
            </div>
            <div>
              <label class="block text-sm text-gray-600 mb-1">Email</label>
              <input id="emailInput" type="email" class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-green-500" />
            </div>
          </div>
          <button id="saveAccount" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">Save Account</button>
        </div>

        <div id="panel-security" class="settings-panel hidden space-y-4">
          <h3 class="text-xl font-semibold">Security</h3>
          <div class="grid md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm text-gray-600 mb-1">New Password</label>
              <input type="password" class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-green-500" placeholder="Enter new password" />
            </div>
            <div>
              <label class="block text-sm text-gray-600 mb-1">Confirm Password</label>
              <input type="password" class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-green-500" placeholder="Confirm new password" />
            </div>
          </div>
          <button class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-900">Update Password</button>
        </div>

        <div id="panel-preferences" class="settings-panel hidden space-y-4">
          <h3 class="text-xl font-semibold">Preferences</h3>
          <div class="space-y-3 text-sm">
            <label class="flex items-center justify-between border border-gray-200 rounded-lg px-4 py-3">
              <span>Email notifications</span>
              <input type="checkbox" checked class="w-4 h-4" />
            </label>
            <label class="flex items-center justify-between border border-gray-200 rounded-lg px-4 py-3">
              <span>SMS alerts</span>
              <input type="checkbox" class="w-4 h-4" />
            </label>
            <label class="flex items-center justify-between border border-gray-200 rounded-lg px-4 py-3">
              <span>Marketing updates</span>
              <input type="checkbox" class="w-4 h-4" />
            </label>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const userData = JSON.parse(localStorage.getItem('safarUser') || '{}');
    const role = userData.userType || userData.UserType;

    if (!role) {
      window.location.href = './src/login.html?v=role-login-v2';
    }

    function getDashboardByRole(currentRole) {
      if (currentRole === 'Admin') return './admin-dashboard.html';
      if (currentRole === 'Driver') return './driver-dashboard.html';
      return './rider-dashboard.html';
    }

    function logoutUser() {
      localStorage.removeItem('safarUser');
      window.location.href = './src/login.html?v=role-login-v2';
    }

    const dashboardLink = document.getElementById('dashboardLink');
    dashboardLink.setAttribute('href', getDashboardByRole(role));

    const profileName = document.getElementById('profileName');
    const profileEmail = document.getElementById('profileEmail');
    const profileRole = document.getElementById('profileRole');
    const nameInput = document.getElementById('nameInput');
    const emailInput = document.getElementById('emailInput');

    profileName.textContent = userData.name || 'User';
    profileEmail.textContent = userData.email || 'user@safar.app';
    profileRole.textContent = role || 'Rider';

    nameInput.value = userData.name || '';
    emailInput.value = userData.email || '';

    document.getElementById('quickLogout').addEventListener('click', logoutUser);
    document.getElementById('mobileLogout').addEventListener('click', logoutUser);

    document.getElementById('saveAccount').addEventListener('click', () => {
      const updatedUser = {
        ...userData,
        name: nameInput.value || userData.name,
        email: emailInput.value || userData.email,
      };
      localStorage.setItem('safarUser', JSON.stringify(updatedUser));
      profileName.textContent = updatedUser.name || 'User';
      profileEmail.textContent = updatedUser.email || 'user@safar.app';
      alert('Account settings saved locally.');
    });

    const tabs = document.querySelectorAll('.settings-tab');
    const panels = document.querySelectorAll('.settings-panel');

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        tabs.forEach((button) => {
          button.classList.remove('bg-green-600', 'text-white');
          button.classList.add('bg-gray-100', 'text-gray-700');
        });
        tab.classList.remove('bg-gray-100', 'text-gray-700');
        tab.classList.add('bg-green-600', 'text-white');

        panels.forEach((panel) => panel.classList.add('hidden'));
        document.getElementById(`panel-${tab.dataset.panel}`).classList.remove('hidden');
      });
    });
  </script>
</body>
</html>
